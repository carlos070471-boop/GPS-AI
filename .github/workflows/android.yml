name: Compilar APK GPS AI
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Voz nativa y permisos Android
        run: |
          cp native/MainActivity.java android/app/src/main/java/com/gpsai/app/MainActivity.java
          cp native/NativeVoicePlugin.java android/app/src/main/java/com/gpsai/app/NativeVoicePlugin.java
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>')
          open(p,'w').write(s)
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPS-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
