<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#ffffff"/><title>GPS AI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/></head><body><div id="app"><div id="map"></div><div class="top"><div class="brand">GPS AI</div><form id="search"><input id="destination" placeholder="¿Adónde vas?" autocomplete="off"/><button>Buscar</button></form><div class="quickMenu"><button id="recentBtn" type="button">RECIENTES</button><button id="favoritesBtn" type="button">★ FAVORITOS</button></div><div id="savedMenu" class="hidden"><div id="savedTitle">Recientes</div><div id="savedList"></div></div><div id="results"></div></div><div id="nextTurn" class="hidden"><strong id="turnArrow">↑</strong><div><b id="turnDistance">--</b><span id="turnText">Continúa recto</span></div></div><div id="mapZoom" aria-label="Zoom del mapa"><button id="zoomIn" aria-label="Acercar mapa">+</button><button id="zoomOut" aria-label="Alejar mapa">−</button></div><button id="voiceSettings" aria-label="Elegir voz">VOZ</button><div id="voiceMenu" class="hidden"><label for="voiceChoice">Voz del asistente</label><select id="voiceChoice"><option value="es-ES-female">Española · Femenina</option><option value="es-ES-male">Española · Masculina</option><option value="es-CO-female">Colombiana · Femenina</option><option value="es-CO-male">Colombiana · Masculina</option></select><button id="testVoice" type="button">Probar voz</button></div><button id="northMode" aria-label="Orientar mapa al norte" aria-pressed="false">N</button><button id="view3d" aria-label="Vista 3D">3D</button><div id="speedPanel" class="hidden"><div class="speedSign limitSign" id="limitSign"><small>LÍMITE</small><strong id="speedLimit">--</strong><span>km/h</span></div><div class="speedSign currentSign" id="currentSign"><small>ACTUAL</small><strong id="currentSpeed">0</strong><span>km/h</span></div></div><button id="locate" aria-label="Mi ubicación">◎</button><div id="routeCard" class="hidden"><strong id="routeTitle">Ruta</strong><button id="favoriteCurrent" type="button" aria-label="Añadir a favoritos" aria-pressed="false">☆</button><span id="routeInfo"></span><div class="tripButtons"><button id="startNav">INICIAR VIAJE</button><button id="cancelNav" class="hidden">CANCELAR VIAJE</button><button id="finishNav" class="hidden">VIAJE FINALIZADO</button></div></div></div><script type="module" src="/src/main.js"></script></body></html>
