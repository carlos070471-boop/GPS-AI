<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#ffffff"/><title>GPS AI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/></head><body><div id="app"><div id="mapStage"><div id="map"></div></div><div id="map3d" aria-label="Mapa de navegación 3D"></div><div id="currentRoadLabel" class="hidden" aria-live="off"></div><div class="top"><div class="brand">GPS AI</div><button id="openSearch" type="button" aria-label="Abrir búsqueda de destino" aria-expanded="false" title="Buscar destino">⌕</button><form id="search" class="hidden"><input id="destination" placeholder="¿Adónde vas?" autocomplete="off"/><button type="submit">Buscar</button><button id="closeSearch" type="button" aria-label="Cerrar búsqueda">✕</button></form><button id="openMenu" type="button" aria-label="Abrir menú" aria-expanded="false" title="Menú">☰</button><div id="quickMenu" class="quickMenu hidden"><button id="recentBtn" type="button">RECIENTES</button><button id="favoritesBtn" type="button">★ FAVORITOS</button></div><div id="savedMenu" class="hidden"><div id="savedTitle">Recientes</div><div id="savedList"></div></div><div id="results"></div></div><div id="nextTurn" class="hidden"><strong id="turnArrow">↑</strong><div><b id="turnDistance">--</b><span id="turnText">Continúa recto</span></div></div><div id="mapZoom" aria-label="Zoom del mapa"><button id="zoomIn" aria-label="Acercar mapa">+</button><button id="zoomOut" aria-label="Alejar mapa">−</button></div><button id="satelliteMode" aria-label="Cambiar entre mapa y satélite" aria-pressed="false">SATÉLITE</button><button id="northMode" aria-label="Orientar mapa al norte" aria-pressed="false">N</button><button id="view3d" aria-label="Vista 3D">3D</button><div id="speedPanel" class="hidden"><div class="speedSign limitSign" id="limitSign"><small
