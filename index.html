<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#ffffff"/><title>GPS AI</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/></head><body><div id="app"><div id="map"></div><div class="top"><div class="brand">GPS AI</div><form id="search"><input id="destination" placeholder="¿Adónde vas?" autocomplete="off"/><button>Buscar</button></form><div id="results"></div></div><div id="mapZoom" aria-label="Zoom del mapa"><button id="zoomIn" aria-label="Acercar mapa">+</button><button id="zoomOut" aria-label="Alejar mapa">−</button></div><button id="view3d" aria-label="Vista 3D">3D</button><div id="speedPanel" class="hidden"><div class="speedSign limitSign" id="limitSign"><small>LÍMITE</small><strong id="speedLimit">--</strong><span>km/h</span></div><div class="speedSign currentSign" id="currentSign"><small>ACTUAL</small><strong id="currentSpeed">0</strong><span>km/h</span></div></div><button id="locate" aria-label="Mi ubicación">◎</button><div id="routeCard" class="hidden"><strong id="routeTitle">Ruta</strong><span id="routeInfo"></span><div class="tripButtons"><button id="startNav">INICIAR VIAJE</button><button id="cancelNav" class="hidden">CANCELAR VIAJE</button><button id="finishNav" class="hidden">VIAJE FINALIZADO</button></div></div></div><script type="module" src="/src/main.js"></script></body></html>
